spring:

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/timecapsule?serverTimezone=Asia/Seoul
    username: root
    password: 1234

  thymeleaf:
    cache: false # 개발 중 화면 수정 반영을 위해 false 설정
  devtools:
    livereload:
      enabled: true
  freemarker:
    cache: false

mybatis:
  # XML 매퍼 파일의 위치 지정
  mapper-locations: classpath:mapper/*.xml
  # 결과 타입을 객체로 매핑할 때 패키지 경로 생략 가능하게 설정
  type-aliases-package: com.example.timecapsule.domain
  configuration:
    map-underscore-to-camel-case: true # DB의 snake_case를 Java의 camelCase로 자동 매핑

server:
    port: 8080


logging:
    level:
      com.example.timecapsule: debug
      org.springframework.security: debug
