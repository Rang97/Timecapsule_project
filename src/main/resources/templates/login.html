<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>타임캡슐 - 로그인</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 500px;">
    <p class="header-flex">WELCOME <span>◀ ❚❚ ▶</span></p>
    <div class="card">
        <h2 class="title">로그인</h2>
        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}" class="error-text" style="color: #ff4956; margin-bottom: 12px;">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.logout}" class="info-text" style="color: #0582ff; margin-bottom: 12px;">
                로그아웃 되었습니다.
            </div>
            <div th:if="${param.signup}" class="info-text" style="color: #01ff9d; margin-bottom: 12px;">
                회원가입이 완료되었습니다. 로그인 해주세요.
            </div>
            <div class="form-group">
                <label>아이디</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">로그인</button>
            <a th:href="@{/signup}" class="btn btn-outline">회원가입</a>
        </form>
    </div>
</div>

</body>
</html>
