<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>타임캡슐 - 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 500px;">
    <p class="header-flex">JOIN US <span> ◀ ❚❚ ▶︎</span></p>
    <div class="card">
        <h2 class="title">회원가입</h2>
        <form th:action="@{/signup}" th:object="${signupForm}" method="post">
            <div th:if="${errorMessage}" class="error-text" style="color: #ff4956; margin-bottom: 10px; padding-top: 7px;" th:text="${errorMessage}"></div>
            <div class="form-group">
                <label>아이디</label>
                <input type="text" th:field="*{username}" class="form-control" required>
                <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:  #ff4956; font-size: 0.8em; padding-top: 7px;"></div>
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" th:field="*{password}" class="form-control" required>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:  #ff4956; font-size: 0.8em; padding-top: 7px;"></div>
            </div>
            <div class="form-group">
                <label>이름</label>
                <input type="text" th:field="*{name}" class="form-control" required>
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red; font-size: 0.8em;"></div>
            </div>
            <button type="submit" class="btn btn-primary">가입하기</button>
            <a th:href="@{/login}" class="btn btn-outline">로그인 화면으로</a>
        </form>
    </div>
</div>

</body>
</html>
